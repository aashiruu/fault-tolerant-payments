apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-provider
  template:
    metadata:
      labels:
        app: payment-provider
    spec:
      containers:
      - name: provider
        image: 870676149863.dkr.ecr.us-east-1.amazonaws.com/payment-system:latest
        command: ["python", "-m", "uvicorn", "services.api.mock_provider:app", "--host", "0.0.0.0", "--port", "8001"]
        env:
        - name: PYTHONPATH
          value: "/app"
        envFrom:
        - configMapRef:
            name: payment-system-config
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: payment-provider
spec:
  selector:
    app: payment-provider
  ports:
  - port: 8001
    targetPort: 8001
