apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: api
        image: 870676149863.dkr.ecr.us-east-1.amazonaws.com/payment-system:latest
        command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONPATH
          value: "/app"
        envFrom:
        - configMapRef:
            name: payment-system-config
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
spec:
  type: LoadBalancer
  selector:
    app: payment-api
  ports:
  - port: 80
    targetPort: 8000
